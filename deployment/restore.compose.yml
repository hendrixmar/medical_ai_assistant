name: medical-assistant-restore

# Intentionally contains no app, WAHA, worker, published port, or provider credentials.
# The restored cluster exists only in tmpfs on an internal-only Docker network.
services:
  restore-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESTORE_BOOTSTRAP_DB:?Generated by restore-isolated.sh}
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:?Choose a restore-only bootstrap role not present in the source cluster}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?Set a strong temporary restore-cluster password}
      SOURCE_APP_DB_NAME: ${SOURCE_APP_DB_NAME:?Set the application database name from the source deployment}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - isolated_restore

networks:
  isolated_restore:
    internal: true
