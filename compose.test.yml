services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medical_assistant_test
      POSTGRES_USER: medical_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD to a temporary generated password}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15439}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
